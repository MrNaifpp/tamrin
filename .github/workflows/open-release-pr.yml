name: Open release PR

# main only ever mirrors code Apple has approved, so nothing here merges
# anything. It keeps a staging → main pull request open whenever staging has
# work main does not, ready for the moment a version is accepted.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Two pushes in quick succession would otherwise both look for an existing PR
# before either had created one, and open duplicates.
concurrency:
  group: open-release-pr
  cancel-in-progress: false

jobs:
  open-release-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Decide whether a PR is needed
        id: check
        run: |
          set -euo pipefail

          ahead=$(gh api "repos/$REPO/compare/main...staging" --jq '.ahead_by')
          echo "staging is $ahead commit(s) ahead of main"

          existing=$(gh pr list --repo "$REPO" --base main --head staging \
            --state open --json number --jq '.[0].number // empty')

          if [ "$ahead" -eq 0 ]; then
            echo "Nothing on staging that main does not already have."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$existing" ]; then
            # An open PR already tracks the branch head, so today's commits are
            # in it already — there is nothing to create or update.
            echo "PR #$existing is already open and now includes these commits."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the PR
        if: steps.check.outputs.needed == 'true'
        env:
          AHEAD: ${{ steps.check.outputs.ahead }}
        run: |
          set -euo pipefail

          # Oldest first, so the list reads in the order the work happened.
          commits=$(gh api "repos/$REPO/compare/main...staging" \
            --jq '.commits[] | "- `\(.sha[0:7])` \(.commit.message | split("\n")[0])"')

          # Built with printf into a file rather than a heredoc: the body
          # carries commit subjects, and passing those through a shell heredoc
          # inside a YAML block is where quoting goes wrong.
          {
            printf 'Opened automatically: `staging` has %s commit(s) that `main` does not.\n\n' "$AHEAD"
            printf '**Do not merge until the matching version is approved on the App Store.** '
            printf '`main` mirrors released code only — merging early puts unreleased work in it.\n\n'
            printf '## Commits\n%s\n' "$commits"
          } > "$RUNNER_TEMP/pr-body.md"

          gh pr create --repo "$REPO" \
            --base main --head staging \
            --title "release: staging → main" \
            --body-file "$RUNNER_TEMP/pr-body.md"
